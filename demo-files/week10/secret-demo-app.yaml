# Week 10, DEMO 5 - lecture only, never copy it. An Application that deploys a Secret with a
# placeholder from Git. Create the namespace and the REAL Secret by hand first:
#   kubectl create namespace secret-demo
#   kubectl -n secret-demo create secret generic demo-secret --from-literal=PASSWORD=the-real-one
# then apply this file: Argo CD puts REPLACE_ME over the real value, and self-heal keeps it.
# Clean up: kubectl -n argocd delete application secret-demo; kubectl delete namespace secret-demo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/inf345/inf345-demo-notes
    targetRevision: main
    path: demo-files/week10/secret-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: secret-demo
  syncPolicy:
    automated:
      prune: false                    # deleting the Application leaves the namespace alone
      selfHeal: true                  # the point of the demo
