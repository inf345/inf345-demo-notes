# The same idea, written to pass review.
name: Greet
on:
  pull_request:
permissions:
  contents: read
jobs:
  greet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Thanks for your PR: $TITLE"
