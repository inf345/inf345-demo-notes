# Week 10, DEMO 5 - the mistake, made on purpose: a Secret in Git with a placeholder.
# Argo CD applies it OVER the real Secret made by hand - and self-heal keeps putting the
# placeholder back. Never do this in a real repository.
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
type: Opaque
stringData:
  PASSWORD: REPLACE_ME
