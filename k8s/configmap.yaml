# Week 9: the settings of the notes service. Not secret, so they live in Git and are
# reviewed like code. Environment variables are read at start: after a change here,
# `kubectl rollout restart deployment/notes` (DEMO 1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
data:
  PORT: "8080"                      # always text - keep the quotes
  GREETING: "Salem"
