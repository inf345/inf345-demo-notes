# Week 8, DEMO 1. A bare Pod: nothing watches it. Delete it and it stays deleted.
apiVersion: v1
kind: Pod
metadata:
  name: notes-by-hand
  labels:
    demo: bare-pod
spec:
  containers:
    - name: notes
      image: ghcr.io/inf345/inf345-demo-notes:c61b28456861561fbfa65c60bc92a8e2c8fc9667
      env:
        - name: PORT
          value: "8080"
