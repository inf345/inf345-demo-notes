# Week 9: one stable name, "notes", in front of the READY Pods that carry app=notes.
apiVersion: v1
kind: Service
metadata:
  name: notes
spec:
  type: ClusterIP
  selector:
    app: notes
  ports:
    - port: 80                      # http://notes means port 80
      targetPort: http              # the container port NAMED http - whatever PORT is
