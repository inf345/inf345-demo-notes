# Week 6, DEMO 1. `docker compose up --build --exit-code-from smoke`
services:
  app:
    build: .
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 10

  smoke:
    image: curlimages/curl:8.22.0
    depends_on:
      app:
        condition: service_healthy
    command: ["-fsS", "http://app:8080/healthz"]
